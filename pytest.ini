[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live" -p no:cacheprovider
markers =
    unit: fast, no network or external services (default)
    integration: uses SQLite/FastAPI/subprocesses but no external services
    live: needs real Vault / Kubernetes / ArgoCD / GitHub / LLM (skipped by default; run with -m live)
