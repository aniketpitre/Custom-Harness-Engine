# Example: a read-only Penko Perry review of every pull request, with a spend cap.
# Copy to .github/workflows/ in your repository and add the provider key as a secret.
name: penko-review
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: penko
        uses: aniketpitre/Custom-Harness-Engine@main      # pin a release tag or commit SHA in real use
        with:
          goal: >
            Review the Kubernetes manifests and Helm values changed in this repository for risky settings
            (privileged pods, missing limits, latest tags, public services). Report findings with file and line.
          mode: read-only
          model: groq/openai/gpt-oss-120b
          max-cost: "0.50"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: echo "Penko Perry spent ${{ steps.penko.outputs.cost-usd }} USD (${{ steps.penko.outputs.outcome }})"
