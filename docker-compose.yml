services:
  vault:
    image: hashicorp/vault:1.20
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Seeds secrets with the dev root token, then mints a least-privilege read-only token for the
  # PenkoPerry Harness. It never receives the root token or the raw provider key.
  vault-init:
    image: hashicorp/vault:1.20
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in .env}
      VAULT_PROVIDER_KEY: ${VAULT_PROVIDER_KEY:-groq}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_APPROVAL_CHAT_ID: ${TELEGRAM_APPROVAL_CHAT_ID:-}
      PENKO_API_TOKEN: ${PENKO_API_TOKEN:?Set PENKO_API_TOKEN in .env}
    entrypoint: ["/bin/sh", "/usr/local/bin/init-vault.sh"]
    volumes:
      - ./docker/init-vault.sh:/usr/local/bin/init-vault.sh:ro
      - vault-token:/run/penko

  penko:
    build:
      context: .
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/penko/vault_token
      VAULT_MOUNT_POINT: harness-secrets
      PENKO_MODEL: ${PENKO_MODEL:-groq/openai/gpt-oss-120b}
      PENKO_WORKSPACE: /workspace        # the only directory the file/shell tools can touch
      PENKO_API_TOKEN: ${PENKO_API_TOKEN:?Set PENKO_API_TOKEN in .env}
      PENKO_APPROVERS: ${PENKO_APPROVERS:-}
      PENKO_GITOPS_REPOS: ${PENKO_GITOPS_REPOS:-}
      PENKO_STAGING_APPS: ${PENKO_STAGING_APPS:-}
      PENKO_WEBHOOK_ENDPOINTS: ${PENKO_WEBHOOK_ENDPOINTS:-}
      PENKO_WEBHOOK_SECRET: ${PENKO_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"   # published on the host loopback only
    volumes:
      - vault-token:/run/penko:ro
      - penko-data:/app/data
      - penko-workspace:/workspace
      # - ${HOME}/.kube:/home/penko/.kube:ro     # uncomment for Kubernetes tools
    restart: unless-stopped

volumes:
  vault-token:
  penko-data:
  penko-workspace:
