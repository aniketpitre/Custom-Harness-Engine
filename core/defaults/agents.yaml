- id: devops_agent
  domain: devops
  system_prompt: "You are a specialized DevOps execution agent."
  allowed_tools:
    - Read
    - DevOpsRead
    - DevOpsWrite
    - Memory
    - Advisor
  max_turns: 30
  rules:
    - "deny:bash(git push --force*)"

- id: read_only_explorer
  domain: devops
  system_prompt: "You are a read-only exploration agent."
  allowed_tools:
    - Read
    - DevOpsRead
