<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Harness Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232a78d6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%232a78d6'/%3E%3Cpath d='M16 2v6M16 24v6M2 16h6M24 16h6M6 6l4 4M22 22l4 4M26 6l-4 4M10 22l-4 4' stroke='%232a78d6' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <div class="brand big"><span class="wheel" aria-hidden="true"></span> Harness</div>
    <p class="muted">Paste the API token. Print it with <code>harness token</code>, or open the dashboard with
      <code>harness dashboard</code> to sign in automatically.</p>
    <label for="token">API token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" required>
    <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
    <button type="submit" class="primary">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="wheel" aria-hidden="true"></span> Harness</div>
    <nav id="nav" aria-label="Sections">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/sessions" data-route="sessions">Sessions</a>
      <a href="#/run" data-route="run">New run</a>
      <a href="#/approvals" data-route="approvals">Approvals <span id="approval-count" class="pill" hidden></span></a>
      <a href="#/usage" data-route="usage">Usage &amp; cost</a>
      <a href="#/schedules" data-route="schedules">Schedules</a>
      <a href="#/skills" data-route="skills">Skills</a>
      <a href="#/agents" data-route="agents">Agents</a>
      <a href="#/plugins" data-route="plugins">Plugins</a>
    </nav>
    <div class="side-foot">
      <button id="theme-toggle" class="ghost" type="button">Theme: auto</button>
      <button id="logout" class="ghost" type="button">Sign out</button>
      <span id="conn" class="muted small">connecting…</span>
    </div>
  </aside>
  <main id="view" class="main" tabindex="-1"></main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="/ui/app.js" defer></script>
</body>
</html>
