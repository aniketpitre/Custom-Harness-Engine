<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PenkoPerry Harness</title>
<link rel="icon" href="/ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <div class="brand big"><img class="logo" src="/ui/logo.svg" alt=""><span class="brand-text">PenkoPerry Harness<small>a custom harness engine</small></span></div>
    <p class="muted">Paste the API token. Print it with <code>penko token</code>, or open the dashboard with
      <code>penko dashboard</code> to sign in automatically.</p>
    <label for="token">API token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" required>
    <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
    <button type="submit" class="primary">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><img class="logo" src="/ui/logo.svg" alt=""><span class="brand-text">PenkoPerry Harness<small>a custom harness engine</small></span></div>
    <nav id="nav" aria-label="Sections">
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/sessions" data-route="sessions">Sessions</a>
      <a href="#/run" data-route="run">New run</a>
      <a href="#/approvals" data-route="approvals">Approvals <span id="approval-count" class="pill" hidden></span></a>
      <a href="#/usage" data-route="usage">Usage &amp; cost</a>
      <a href="#/schedules" data-route="schedules">Schedules</a>
      <a href="#/skills" data-route="skills">Skills</a>
      <a href="#/agents" data-route="agents">Agents</a>
      <a href="#/plugins" data-route="plugins">Plugins</a>
    </nav>
    <div class="side-foot">
      <button id="theme-toggle" class="ghost" type="button">Theme: auto</button>
      <button id="logout" class="ghost" type="button">Sign out</button>
      <span id="conn" class="muted small">connecting…</span>
    </div>
  </aside>
  <main id="view" class="main" tabindex="-1"></main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="/ui/app.js" defer></script>
</body>
</html>
